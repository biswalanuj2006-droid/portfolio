<div class="ai-assistant" id="aiAssistant">
  <button class="ai-fab" id="aiFab" aria-label="Open AI assistant">
    <i class="bi bi-robot"></i>
    <span class="ai-fab-pulse"></span>
  </button>
  <div class="ai-panel" id="aiPanel" aria-hidden="true">
    <div class="ai-header">
      <div class="ai-avatar"><i class="bi bi-robot"></i></div>
      <div class="ai-heading">
        <strong>Portfolio Assistant</strong>
        <span>I answer questions about Anuj</span>
      </div>
      <button class="ai-close" id="aiClose" aria-label="Close"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="ai-messages" id="aiMessages"></div>
    <div class="ai-chips" id="aiChips"></div>
    <form class="ai-input" id="aiForm">
      <input type="text" id="aiText" placeholder="Ask about Anuj..." autocomplete="off" aria-label="Ask a question">
      <button type="submit" aria-label="Send"><i class="bi bi-send-fill"></i></button>
    </form>
  </div>
</div>
