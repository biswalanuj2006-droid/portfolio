{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login - Anuj Biswal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{% static 'css/admin.css' %}" rel="stylesheet">
</head>
<body class="login-body">
<div class="login-bg">
  <div class="login-blob lb-1"></div>
  <div class="login-blob lb-2"></div>
  <div class="login-blob lb-3"></div>
</div>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo"><span class="brand-mark">AB</span></div>
    <h2>Welcome back</h2>
    <p class="login-sub">Sign in to manage the portfolio</p>
    {% if error %}<div class="alert alert-danger glass-alert"><i class="bi bi-exclamation-triangle-fill"></i> {{ error }}</div>{% endif %}
    <form method="post" action="{% url 'core:admin_login' %}" class="login-form">
      {% csrf_token %}
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-ic"><i class="bi bi-person-fill"></i><input type="text" id="username" name="username" class="form-control" placeholder="admin" autocomplete="username" required autofocus></div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-ic"><i class="bi bi-lock-fill"></i><input type="password" id="password" name="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required></div>
      </div>
      <button type="submit" class="btn btn-neon w-100 login-btn"><i class="bi bi-box-arrow-in-right"></i> Sign In</button>
    </form>
    <a class="login-back" href="{% url 'core:home' %}"><i class="bi bi-arrow-left"></i> Back to website</a>
  </div>
</div>
</body>
</html>
