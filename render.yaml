# Render Blueprint - https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then in Render dashboard:
#   New + -> Blueprint -> pick this repo -> Apply.
# Requires the `ADMIN_PASSWORD` env var to be set (dashboard -> Environment).

databases:
  - name: anuj-portfolio-db
    plan: free
    databaseName: anuj_portfolio
    user: anuj_portfolio

services:
  - type: web
    name: anuj-portfolio
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn portfolio.wsgi:application --timeout 120
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anuj-portfolio-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: ADMIN_USERNAME
        value: "Anuj-2006"
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: "biswalanuj2006@gmail.com"
